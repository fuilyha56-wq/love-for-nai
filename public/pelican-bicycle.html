<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>骑自行车的鹈鹕</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #d7ebe9;
    }

    svg {
      display: block;
      width: min(100%, 1200px);
      height: auto;
    }
  </style>
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title description">
    <title id="title">骑自行车的鹈鹕</title>
    <desc id="description">一只戴着蓝色小帽的白色鹈鹕骑着红色自行车，驶过阳光下的海边小路。</desc>
    <defs>
      <linearGradient id="sky" x2="0" y2="1">
        <stop stop-color="#a9dce2"/>
        <stop offset="1" stop-color="#eef3de"/>
      </linearGradient>
      <linearGradient id="pouch" x2="0" y2="1">
        <stop stop-color="#f9cf83"/>
        <stop offset="1" stop-color="#df8c63"/>
      </linearGradient>
      <pattern id="road-dots" width="46" height="28" patternUnits="userSpaceOnUse">
        <circle cx="8" cy="9" r="2" fill="#f7f4e6" opacity=".6"/>
      </pattern>
    </defs>

    <rect width="1200" height="800" fill="url(#sky)"/>
    <circle cx="986" cy="139" r="72" fill="#ffdf92"/>
    <path d="M0 427 Q230 394 429 423 T841 419 T1200 425 V575 H0Z" fill="#7cb8b0"/>
    <path d="M0 488 Q222 462 419 482 T841 479 T1200 480 V597 H0Z" fill="#5e9d9c"/>
    <path d="M0 575 Q265 552 489 573 T1200 566 V800 H0Z" fill="#e6c99e"/>
    <path d="M0 649 Q319 633 600 650 T1200 644 V800 H0Z" fill="#d8aa79"/>
    <path d="M0 649 Q319 633 600 650 T1200 644 V800 H0Z" fill="url(#road-dots)"/>
    <path d="M62 551 q34 -12 66 -2 m35 10 q28 -8 57 0 m777 -13 q43 -13 79 -1" fill="none" stroke="#f8e9c8" stroke-width="5" stroke-linecap="round" opacity=".8"/>

    <!-- The wheels and frame stay visible behind the rider. -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <g stroke="#344e52" stroke-width="9">
        <circle cx="319" cy="595" r="145" fill="#f5e3bf"/>
        <circle cx="883" cy="595" r="145" fill="#f5e3bf"/>
      </g>
      <g stroke="#f8f3df" stroke-width="3" opacity=".9">
        <path d="M319 450 V740 M174 595 H464 M216 492 422 698 M216 698 422 492"/>
        <path d="M883 450 V740 M738 595 H1028 M780 492 986 698 M780 698 986 492"/>
      </g>
      <circle cx="319" cy="595" r="18" fill="#344e52"/>
      <circle cx="883" cy="595" r="18" fill="#344e52"/>
      <path d="M319 595 466 455 607 595 319 595 500 595 466 455 M500 595 747 451 883 595 M607 595 747 451" stroke="#d65d46" stroke-width="15"/>
      <path d="M319 595 398 440 M379 440 h89 M747 451 725 398 h85 M725 398 l-17 -33 h55" stroke="#344e52" stroke-width="11"/>
      <path d="M607 595 l47 54 h49 M607 595 l-47 -53 h-48" stroke="#344e52" stroke-width="10"/>
      <circle cx="607" cy="595" r="24" fill="#efb960" stroke="#344e52" stroke-width="7"/>
    </g>

    <!-- Tail, body and the far wing form the rider's silhouette. -->
    <path d="M411 372 Q321 336 293 267 Q370 296 440 287 Q478 343 411 372Z" fill="#d9dcd1" stroke="#45565a" stroke-width="6" stroke-linejoin="round"/>
    <path d="M365 347 Q428 273 570 293 Q687 318 667 418 Q650 492 543 492 Q428 485 370 423 Q341 385 365 347Z" fill="#fffaf0" stroke="#45565a" stroke-width="7"/>
    <path d="M409 370 Q459 340 516 360 Q561 378 555 421 Q511 447 450 427 Q415 410 409 370Z" fill="#e3e2d4"/>
    <path d="M441 433 q23 23 53 22 m-76 -51 q23 22 50 22" fill="none" stroke="#b8c7bd" stroke-width="6" stroke-linecap="round"/>

    <!-- The long neck curls up from the chest. -->
    <path d="M562 345 Q615 326 620 267 Q611 206 649 167 Q686 131 722 153 Q751 170 744 203 Q731 230 704 230 Q675 234 675 267 Q687 335 646 394 Q617 436 557 419Z" fill="#fffaf0" stroke="#45565a" stroke-width="7" stroke-linejoin="round"/>
    <path d="M655 163 q30 -42 73 -20 l27 21 -112 16Z" fill="#4c8797" stroke="#344e52" stroke-width="6" stroke-linejoin="round"/>
    <path d="M645 180 Q700 163 763 179" fill="none" stroke="#344e52" stroke-width="7" stroke-linecap="round"/>
    <circle cx="714" cy="192" r="7" fill="#283c41"/>
    <circle cx="716" cy="189" r="2" fill="#fff"/>

    <!-- The orange pouch hangs below the beak. -->
    <path d="M731 223 Q844 235 978 218 Q951 293 887 320 Q811 344 755 287 Q733 263 731 223Z" fill="url(#pouch)" stroke="#935b4c" stroke-width="6" stroke-linejoin="round"/>
    <path d="M731 213 Q833 207 1010 202 Q993 219 966 226 Q839 244 731 228Z" fill="#f7c46e" stroke="#935b4c" stroke-width="6" stroke-linejoin="round"/>
    <circle cx="750" cy="220" r="4" fill="#935b4c"/>
    <path d="M777 284 Q840 323 900 287" fill="none" stroke="#bb745c" stroke-width="5" stroke-linecap="round" opacity=".7"/>

    <!-- One wing grips the handlebar; the feet reach the pedals. -->
    <path d="M531 357 Q591 343 655 358 Q691 365 707 381 L737 375 Q757 381 749 398 Q732 416 702 408 Q641 414 575 405 Q535 395 531 357Z" fill="#fffaf0" stroke="#45565a" stroke-width="7" stroke-linejoin="round"/>
    <path d="M621 394 q24 12 55 10" fill="none" stroke="#b8c7bd" stroke-width="5" stroke-linecap="round"/>
    <path d="M513 470 Q519 515 558 543 L606 553 M566 461 Q599 484 598 525 L653 648" fill="none" stroke="#de9663" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M588 552 q23 15 56 7 m-2 90 q25 11 49 1" fill="none" stroke="#d17d52" stroke-width="13" stroke-linecap="round"/>

    <path d="M76 719 q45 -14 88 0 m784 17 q52 -14 101 0" fill="none" stroke="#f4dbaf" stroke-width="7" stroke-linecap="round" opacity=".8"/>
  </svg>
</body>
</html>
