# Managed LFN API HTTPS prefix. Include inside the existing TLS server block.
# Reuses that server's certificate and renewal; no certificate keys are copied.
location = /lfn {
    return 308 /lfn/;
}

location ^~ /lfn/ {
    proxy_pass http://127.0.0.1:41801/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 32m;
    proxy_read_timeout 450s;
    proxy_send_timeout 450s;
    proxy_buffering off;
}
