services:
  lfn-web:
    # 生产机只运行预先构建并导入的镜像，通过 LFN_IMAGE 固定发布版本。
    image: ${LFN_IMAGE:-love-for-nai:latest}
    pull_policy: never
    container_name: love-for-nai
    restart: unless-stopped
    environment:
      LFN_AUTH_PROVIDER: ${LFN_AUTH_PROVIDER:-newapi}
      NEWAPI_BASE_URL: ${NEWAPI_BASE_URL:-http://host.docker.internal:3000}
      LFN_AFF_GATEWAY_URL: ${LFN_AFF_GATEWAY_URL:-}
      LFN_AFF_GATEWAY_TOKEN: ${LFN_AFF_GATEWAY_TOKEN:-}
      LFN_IMAGE_PROVIDER_URL: ${LFN_IMAGE_PROVIDER_URL:-}
      LFN_IMAGE_PROVIDER_TOKEN: ${LFN_IMAGE_PROVIDER_TOKEN:-}
      QUOTA_PER_UNIT: ${QUOTA_PER_UNIT:-500000}
      LFN_SESSION_SECRET: ${LFN_SESSION_SECRET:?LFN_SESSION_SECRET is required}
      LFN_COOKIE_SECURE: ${LFN_COOKIE_SECURE:-false}
      LFN_PUBLIC_URL: ${LFN_PUBLIC_URL:-http://47.108.250.118:41800}
      LFN_DATA_DIR: /app/data
      SOURCE_CODE_URL: ${SOURCE_CODE_URL:-}
      LFN_OUTBOUND_PROXY: ${LFN_OUTBOUND_PROXY:-}
      LFN_TRUST_PROXY: ${LFN_TRUST_PROXY:-false}
      LFN_ADMIN_TOKEN: ${LFN_ADMIN_TOKEN:-}
      LFN_ADMIN_USER_ID: ${LFN_ADMIN_USER_ID:-1}
      LFN_REGISTER_GROUP: ${LFN_REGISTER_GROUP:-Draw}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${LFN_PORT:-21142}:3000"
    volumes:
      - lfn-data:/app/data
    mem_limit: 512m
    cpus: "1.0"
    pids_limit: 256
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  lfn-data:
