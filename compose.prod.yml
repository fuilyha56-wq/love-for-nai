services:
  lfn-web:
    image: love-for-nai:b3b2f21d-deploy1
    pull_policy: never
    container_name: love-for-nai
    restart: unless-stopped
    environment:
      NEWAPI_BASE_URL: ${NEWAPI_BASE_URL:-http://host.docker.internal:3000}
      QUOTA_PER_UNIT: ${QUOTA_PER_UNIT:-500000}
      LFN_SESSION_SECRET: ${LFN_SESSION_SECRET:?LFN_SESSION_SECRET is required}
      LFN_COOKIE_SECURE: ${LFN_COOKIE_SECURE:-false}
      LFN_DATA_DIR: /app/data
      SOURCE_CODE_URL: ${SOURCE_CODE_URL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${LFN_PORT:-21142}:3000"
    volumes:
      - lfn-data:/app/data
    mem_limit: 512m
    cpus: "1.0"
    pids_limit: 256
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  lfn-data:
